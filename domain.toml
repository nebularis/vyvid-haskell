# SPDX-License-Identifier: MIT
name = "haskell"
description = "How to do things with Haskell's compiler indexes, such as .hie files and hiedb, each note measured or run"
visibility = "public"
rules = []

[families]
NOTE = { defined = "notes.md", type = "note" }

[[recipes]]
name = "how-do-i"
description = "When asking how to do something with a Haskell compiler index"
budget = 1200
steps = [
  { step = "find", words = "{question}", kind = "note", limit = 6 },
  { step = "take", n = 4 },
]
